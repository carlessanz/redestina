# Configuración del CLI de Supabase para REDESTINA.
#
# Dos usos, y conviene no confundirlos (AGENTS.md §7 y §11):
#
# 1. PRODUCCIÓN (el proyecto remoto `uxppvaldhptdomvdhsmn`), que sigue siendo la base de
#    verdad. De este fichero solo le afectan la versión de Postgres, las migraciones y los
#    bloques [functions.*], que `supabase functions deploy` lee para el `verify_jwt`.
# 2. EL CLON LOCAL en Docker (desde el 07-10-2026): todas las demás secciones —api,
#    studio, local_smtp, storage, auth, puertos 553xx— solo describen el stack que levanta
#    `supabase start` en esta máquina.
#
# 🔴 NUNCA `supabase config push`. Subiría a producción el `site_url` de localhost y la
#    configuración de Auth local (pasó el 21-07-2026 y dejó fuera al equipo; §9).
# 🔴 NUNCA `--linked` con `db reset`: el repo está enlazado a producción y la borraría.
#    Sin `--linked`, `supabase db reset` actúa solo sobre el stack local.
#
# Puertos 553xx: no chocan con los otros proyectos de la máquina (5432x, 5442x, 5542x,
# 5642x). Referencia: https://supabase.com/docs/guides/local-development/cli/config

project_id = "Redestina"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
# La versión mayor del Postgres REMOTO. Tiene que coincidir con `SHOW server_version;`
# en producción: el clon local la usa para elegir la imagen.
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
# Si se desactiva, `db push` y `db reset` se saltan las migraciones.
enabled = true
schema_paths = []

[db.seed]
# Sin seed: los datos del clon salen del volcado de producción (scripts/local/).
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

# Buzón de pruebas del stack local. Los correos de Redestina NO llegan aquí: van por
# Resend, y en local se simulan (sin RESEND_ENVIO_REAL).
[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Como producción: nadie se da de alta solo; las cuentas las crea `registro` con la
# Admin API, que ignora este interruptor.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# ⚠️ `true` A PROPÓSITO, aunque arriba el alta esté cerrada. Este interruptor es el del
# PROVEEDOR de correo: en `false`, el stack local apaga el login con contraseña
# («Email logins are disabled»). Producción lo tiene encendido igual.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
# 8083 lo usan otros proyectos de la máquina.
inspector_port = 8073
# La versión de Deno con la que se empaquetan las funciones al desplegarlas.
deno_version = 2

# Apagado: en el stack local pesa casi 1 GB y Redestina no lo usa.
[analytics]
enabled = false
port = 55327
backend = "postgres"

# Motor de diff para `db diff`, `db pull` y `db remote commit` contra el remoto.
[experimental.pgdelta]
enabled = true

[functions.whatsapp-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/whatsapp-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whatsapp-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whatsapp-webhook/*.html" ]

[functions.whatsapp-send]
enabled = true
# Con JWT: la plataforma corta antes de entrar. Dentro, exigirEquipo() vuelve a
# comprobar la sesión y el rol (service_role ignora RLS, §4bis), así que son dos
# barreras, no una repetida.
verify_jwt = true
import_map = "./functions/whatsapp-send/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whatsapp-send/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whatsapp-send/*.html" ]

# La invoca pg_cron vía pg_net (sin JWT); se protege con un secreto compartido propio.
[functions.intake-recordatorios]
enabled = true
verify_jwt = false
import_map = "./functions/intake-recordatorios/deno.json"
entrypoint = "./functions/intake-recordatorios/index.ts"

# Envío de ofertas por email (Resend). Requiere sesión: se despliega con verify_jwt.
[functions.enviar-email]
enabled = true
verify_jwt = true
import_map = "./functions/enviar-email/deno.json"
entrypoint = "./functions/enviar-email/index.ts"

# Recuperar contraseña: la llama un usuario NO autenticado, se despliega --no-verify-jwt.
[functions.recuperar-password]
enabled = true
verify_jwt = false
import_map = "./functions/recuperar-password/deno.json"
entrypoint = "./functions/recuperar-password/index.ts"

# Registro público: la llama quien todavía no tiene cuenta, así que tampoco verifica JWT.
# Es la única función pública que ESCRIBE; el anti-abuso vive dentro (honeypot, límite
# por IP y freno global por registros pendientes).
[functions.registro]
enabled = true
verify_jwt = false
import_map = "./functions/registro/deno.json"
entrypoint = "./functions/registro/index.ts"

# Las tres de abajo funcionaban ya con JWT, pero por el DEFAULT del CLI, no porque
# nadie lo hubiera escrito. Se declaran para que el repo sea la fuente de verdad:
# la deuda 43 (whatsapp-send desplegada sin JWT) nació justo de esa distancia entre
# lo que decía la documentación y lo que declaraba este fichero.

# Ranking de entidades para un excedente. Corre con service_role (ignora RLS), así que
# exigirEquipo() decide dentro; el JWT es la barrera de la plataforma delante.
[functions.priorizar-entidades]
enabled = true
verify_jwt = true
import_map = "./functions/priorizar-entidades/deno.json"
entrypoint = "./functions/priorizar-entidades/index.ts"

# Alta de oferta desde el panel del productor. Es quien genera id_excedente y
# texto_oferta (authenticated no tiene INSERT sobre excedentes), así que exige sesión.
[functions.crear-oferta]
enabled = true
verify_jwt = true
import_map = "./functions/crear-oferta/deno.json"
entrypoint = "./functions/crear-oferta/index.ts"

# Enlace mágico por correo / código por WhatsApp. Restringida al equipo (exigirEquipo)
# y sujeta al gate de cuenta del modo test (§8).
[functions.enviar-acceso]
enabled = true
verify_jwt = true
import_map = "./functions/enviar-acceso/deno.json"
entrypoint = "./functions/enviar-acceso/index.ts"

# Sistema documental (§4). Genera el PDF de un documento ya emitido y lo sube al bucket
# privado. No verifica JWT porque la llaman el trigger de encolado y el job de reintento
# por pg_net, que no tienen sesión; se protege con el secreto compartido
# `x-documentos-secret` (mismo patrón que intake-recordatorios).
# 🔴 `static_files` YA NO SIRVE PARA NADA AQUÍ, y se deja solo porque los ficheros siguen
# siendo la fuente de verdad. El 21-09-2026 un redespliegue con el CLI nuevo cambió el
# empaquetado y esos ficheros DEJARON DE LLEGAR al isolate: `Deno.readFile` respondía
# `path not found` para todos los documentos, y en el árbol real no existía ni el
# directorio del propio módulo. Las fuentes y el logo van ahora DENTRO del bundle, en
# `activos/incrustats.ts` (se regenera con `deno run -A scripts/incrustar-activos.ts`).
# No volver a depender de esta línea para leer nada en ejecución.
[functions.generar-documento]
enabled = true
verify_jwt = false
import_map = "./functions/generar-documento/deno.json"
entrypoint = "./functions/generar-documento/index.ts"
static_files = [ "./functions/generar-documento/activos/*" ]

# Devuelve una URL firmada de 60 s del PDF, tras comprobar el permiso con
# puede_ver_documento(). Nadie lee el bucket directamente: no hay ninguna política en
# storage.objects.
[functions.descargar-documento]
enabled = true
verify_jwt = true
import_map = "./functions/descargar-documento/deno.json"
entrypoint = "./functions/descargar-documento/index.ts"

# Vuelve a mandar por correo un documento ya emitido, al destinatario de su `envio` y con
# las mismas barreras que el envío original (_shared/envia-document.ts). Solo el equipo.
[functions.reenviar-documento]
enabled = true
verify_jwt = true
import_map = "./functions/reenviar-documento/deno.json"
entrypoint = "./functions/reenviar-documento/index.ts"

# Recordatorios del circuito documental: enlaces sin usar a 7 y 14 días. La llama pg_cron
# a las 7:00 (disparar_recordatorios_documentales), así que va sin JWT y con el mismo
# secreto compartido que generar-documento. No sirve ficheros estáticos.
[functions.recordatorios-documentales]
enabled = true
verify_jwt = false
import_map = "./functions/recordatorios-documentales/deno.json"
entrypoint = "./functions/recordatorios-documentales/index.ts"

# Confirmación de albaranes sin sesión (fase 3). Pública: quien confirma una entrega no
# tiene cuenta. Lo que la protege es el token —32 bytes, y en la base solo su sha256—,
# no la plataforma. Anti-abuso propio dentro: honeypot, límite por IP y freno durable.
[functions.enlace-publico]
enabled = true
verify_jwt = false
import_map = "./functions/enlace-publico/deno.json"
entrypoint = "./functions/enlace-publico/index.ts"

# Subida del albarán del productor, facturas y fotos de incidencias. Multipart, 10 MB,
# equipo o titular del objeto.
[functions.subir-documento-externo]
enabled = true
verify_jwt = true
import_map = "./functions/subir-documento-externo/deno.json"
entrypoint = "./functions/subir-documento-externo/index.ts"

# Verificación pública de un certificado de recepción (F4). Sin JWT: quien comprueba un
# certificado es un tercero —un ayuntamiento, una financiadora, un auditor— que no tiene
# cuenta. Lo que autoriza es conocer el código impreso (16 hex del sha256 del snapshot, o
# sea 64 bits). Es de SOLO LECTURA y devuelve ocho campos y nada más: ni el PDF, ni el
# detalle por producto, ni ninguna de las dos listas de procedencia —que nombran a
# generadores y municipios de terceros—. Anti-abuso propio dentro (límite por IP).
[functions.verificar-certificat]
enabled = true
verify_jwt = false
import_map = "./functions/verificar-certificat/deno.json"
entrypoint = "./functions/verificar-certificat/index.ts"

# Limpieza de los PDF huérfanos de los ciclos de prueba (§12.51, §12.88). La otra mitad de
# `reiniciar_documentos_prova()`: SQL borra las filas y esto los objetos del bucket, que SQL no
# puede tocar. Con JWT porque quien la lanza es una persona desde el panel, y dentro exige
# super_admin. Solo mira dentro de `proves/` y solo borra lo que ninguna fila reclama.
[functions.limpiar-documentos-prueba]
enabled = true
verify_jwt = true
import_map = "./functions/limpiar-documentos-prueba/deno.json"
entrypoint = "./functions/limpiar-documentos-prueba/index.ts"

# Avisos a las organizaciones (05-10-2026, rebanada 2). La llama la base por pg_net al
# insertar en `avisos` (y el job `avisos-pendents`), así que va sin JWT y con el secreto
# compartido de los documentos (`x-documentos-secret`).
[functions.enviar-avis]
enabled = true
verify_jwt = false
import_map = "./functions/enviar-avis/deno.json"
entrypoint = "./functions/enviar-avis/index.ts"

# La recogida programada (05-10-2026, rebanada 3). La llama pg_cron cada 15 min: emite los
# albaranes a la hora de recogida, los marca entregados y manda los enlaces de confirmación.
[functions.recollides-programades]
enabled = true
verify_jwt = false
import_map = "./functions/recollides-programades/deno.json"
entrypoint = "./functions/recollides-programades/index.ts"
