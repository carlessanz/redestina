<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: hace falta para que env(safe-area-inset-*) valga algo en
         iPhone; lo usa la barra inferior de navegación. Sin maximum-scale, a propósito:
         bloquear el zoom es un problema de accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234C66" />
    <!-- iOS no lee el manifest para el icono ni para el modo standalone -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Las dos: `mobile-web-app-capable` es la estándar de hoy y la que mira Chrome;
         la de Apple sigue haciendo falta porque Safari solo entiende la suya. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Redestina" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Redestina · Espigoladors</title>
    <meta name="description" content="Redestina connecta productors agraris amb entitats socials i receptores per canalitzar excedents alimentaris. Un projecte de la Fundació Espigoladors." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Redestina · Espigoladors" />
    <meta property="og:description" content="Els excedents del camp, allà on aprofiten. Canalització d'excedents agrícoles de la Fundació Espigoladors." />
    <meta property="og:url" content="https://redestina.carlessanz.com/" />
    <meta property="og:image" content="https://redestina.carlessanz.com/icona-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
